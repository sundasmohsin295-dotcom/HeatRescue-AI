<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeatRescue AI | Enterprise Climate Decision Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body class="theme-dark">

  <div class="app-layout">
    
    <!-- 8-Domain Scannable Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">HR-AI</div>
        <div>
          <h2>HEATRESCUE</h2>
          <span class="subtext">v3.0.0-ENTERPRISE</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">CORE OPERATIONS</div>
        <button class="nav-item active" data-domain="command">🚨 1. Command Center</button>
        <button class="nav-item" data-domain="intelligence">🗺️ 2. Heat Intelligence</button>
        <button class="nav-item" data-domain="investigation">🤖 3. AI Investigator</button>

        <div class="nav-section-title">PREDICTION & OPERATIONS</div>
        <button class="nav-item" data-domain="prediction">🧪 4. Simulation Lab</button>
        <button class="nav-item" data-domain="operations">🛡️ 5. Response Operations</button>

        <div class="nav-section-title">SECURITY & GOVERNANCE</div>
        <button class="nav-item" data-domain="security">🔐 6. Cybersecurity</button>
        <button class="nav-item" data-domain="audit">📜 7. Incidents & Audit</button>
        <button class="nav-item" data-domain="admin">⚙️ 8. Administration</button>
      </nav>

      <div class="sidebar-user-footer">
        <div class="user-avatar">DM</div>
        <div class="user-meta">
          <strong>Director Sarah Chen</strong>
          <span class="subtext">Incident Commander (L4)</span>
        </div>
      </div>
    </aside>

    <!-- Operational Viewport -->
    <div class="workspace">
      <header class="top-nav">
        <div class="nav-left">
          <h2 id="domain-header-title">Command Center</h2>
          <span class="breadcrumb" id="domain-header-desc">Executive operational overview & real-time telemetry</span>
        </div>

        <div class="nav-metrics">
          <div class="metric-pill">
            <span class="pulse-dot green"></span>
            <span id="telemetry-source-label">FORTYGUARD: LIVE (2m AGL)</span>
          </div>
          <div class="metric-pill">
            <span>AUDIT CHAIN:</span>
            <strong id="header-audit-blocks">0 BLOCKS</strong>
          </div>
        </div>

        <div class="nav-controls">
          <button id="theme-toggle-btn" class="btn btn-secondary">☀️ Light Mode</button>
          <button id="run-master-demo-btn" class="btn btn-warning">🎬 Launch Judge Demo</button>
        </div>
      </header>

      <main class="view-viewport" id="domain-viewport"></main>
    </div>
  </div>

  <div class="toast-deck" id="toast-deck"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
